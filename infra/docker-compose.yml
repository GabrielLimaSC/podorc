# Local infrastructure for podorc: Kafka (KRaft, single node) + Postgres.
# Zero config needed — `docker compose up` uses the defaults below, which match the
# application's own defaults in orchestrator-core/src/main/resources/application.yml.
# Override any value via the shell environment (or an infra/.env file).
#
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml down -v      # -v also drops the volumes
#
# See infra/README.md for the full up -> connect -> down -v -> up cycle.

name: podorc

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-podorc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podorc}
      POSTGRES_DB: ${POSTGRES_DB:-podorc}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-podorc} -d ${POSTGRES_DB:-podorc}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: other containers reach the broker at kafka:29092.
      # EXTERNAL: the host (app, CLI tools) reaches it at localhost:9092.
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Single-node: everything replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the kafka-init service, never implicitly.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s

  # One-shot: creates the two orchestrator topics, then exits 0. Idempotent (--if-not-exists).
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        kafka=/opt/kafka/bin
        for topic in orchestrator.inbound orchestrator.outbound; do
          $$kafka/kafka-topics.sh --bootstrap-server kafka:29092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions "${ORCHESTRATOR_TOPIC_PARTITIONS:-3}" --replication-factor 1
        done
        echo "topics:"
        $$kafka/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"

volumes:
  postgres-data:
  kafka-data:
