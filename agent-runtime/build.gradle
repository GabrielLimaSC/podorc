plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}

// Library module, not a standalone Spring Boot app in v1: it is composed into
// orchestrator-core and boots in the same JVM. The Spring Boot BOM is imported only
// to align dependency versions; no `bootJar` is produced here.
dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

dependencies {
    api project(':contracts')

    implementation 'org.springframework.boot:spring-boot-starter'
    // LLM CLI envelope parsing. Version managed by the Spring Boot BOM above.
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests never touch a real CLI. Tests tagged "live" (they shell out to `claude`,
// `codex`, ...) are excluded here and run only via the `liveTest` task below.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live'
    }
}

tasks.register('liveTest', Test) {
    description = 'Runs @Tag("live") tests against the real provider CLIs (must be logged in).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    // Live calls hit the network and a real subscription window; never cache the result.
    outputs.upToDateWhen { false }
}
