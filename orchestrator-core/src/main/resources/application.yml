spring:
  application:
    name: podorc

  # Defaults match infra/docker-compose.yml, so `docker compose up` + `bootRun` just works.
  datasource:
    url: ${PODORC_DB_URL:jdbc:postgresql://localhost:5432/podorc}
    username: ${PODORC_DB_USERNAME:podorc}
    password: ${PODORC_DB_PASSWORD:podorc}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  kafka:
    bootstrap-servers: ${PODORC_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    # Topics are provisioned by infra (kafka-init); the app never auto-creates them.
    consumer:
      group-id: ${PODORC_KAFKA_GROUP_ID:podorc-orchestrator}
      auto-offset-reset: earliest

server:
  port: ${PODORC_HTTP_PORT:8080}

# Only health/info are exposed. Details are hidden unless an operator opts in via env,
# so the panel never leaks internal state through the actuator surface.
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: ${PODORC_HEALTH_SHOW_DETAILS:never}

# LLM runtime (S1-05). Decision 2: no API key — the adapter shells out to the `claude` CLI under the
# operator's subscription login. Only the executable path and call limits live here.
podorc:
  llm:
    claude-cli-path: ${PODORC_LLM_CLAUDE_CLI_PATH:claude}
    # CLI cold start + a real completion; raise if models with long thinking time time out.
    timeout: ${PODORC_LLM_TIMEOUT:180s}
    # Passed to `--disallowedTools`; "*" blocks every tool (the S1 echo agent has none).
    disallowed-tools: ${PODORC_LLM_DISALLOWED_TOOLS:*}
