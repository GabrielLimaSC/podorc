pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Lets `./gradlew build` provision a JDK 21 toolchain on a clean checkout.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'podorc'

include 'contracts'
include 'orchestrator-core'
include 'agent-runtime'
